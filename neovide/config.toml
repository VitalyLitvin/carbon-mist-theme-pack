# Neovide: параметры окна (применяются при запуске).
# Редактор — шрифт, стекло, курсор — настраивается в
# ~/.config/nvim/lua/config/options.lua (блок vim.g.neovide).

# Прозрачная полоса заголовка: стекло и рамка из размытого фона идут до
# самого верха окна. Кнопки окна остаются, Neovide сам добавляет высоту
# заголовка к neovide_padding_top, окно перетаскивается за верхнюю полосу.
frame = "transparent"
title-hidden = true

# Запуск `neovide` из терминала не блокирует его
fork = true
